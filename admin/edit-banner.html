<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Banner - MFM Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="edit-banner.css">
</head>
<body class="admin-edit-page">

  <!-- Title Bar: "Edit Banner" -->
  <header class="edit-banner-header">
    <div class="header-left">
      <a href="index.html" class="header-back-btn" aria-label="Go back to Admin Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="header-icon">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h1 class="header-title">Edit Banner</h1>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="edit-banner-container">

    <!-- Search & Statistics Bar -->
    <section class="search-stats-section">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-svg" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="bannerSearchInput" class="banner-search-input" placeholder="Search banners by title, badge, or text..." aria-label="Search banners">
        <button id="clearSearchBtn" class="clear-search-btn" style="display:none;" aria-label="Clear search">&times;</button>
      </div>

      <div class="stats-pills">
        <span class="stat-pill" id="totalCountPill">Total: 4</span>
        <span class="stat-pill pill-active" id="visibleCountPill">Active: 4</span>
        <span class="stat-pill pill-hidden" id="hiddenCountPill">Hidden: 0</span>
      </div>
    </section>

    <!-- Banners List: Reposition, Hide, Edit, Remove -->
    <section class="banner-list-section">
      <div class="list-header">
        <h2>Existing Banners (<span id="bannerListCount">0</span>)</h2>
        <span class="list-subtext">Use arrows to reposition &bull; Toggle eye to hide/show</span>
      </div>

      <div class="banners-list" id="bannersList">
        <!-- Dynamically injected items -->
      </div>
    </section>

  </main>

  <!-- Delete Confirmation Modal -->
  <div class="admin-modal-overlay" id="deleteModalOverlay">
    <div class="admin-modal">
      <h3 class="modal-alert-title">Remove Banner?</h3>
      <p class="modal-alert-msg" id="deleteModalMsg">Are you sure you want to remove this banner? This action will immediately delete it from both admin and public carousels.</p>
      <div class="modal-actions">
        <button class="modal-btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
        <button class="modal-btn btn-danger" id="confirmDeleteBtn">Delete Banner</button>
      </div>
    </div>
  </div>

  <script src="banners.js"></script>
  <script src="edit-banner.js"></script>
</body>
</html>
